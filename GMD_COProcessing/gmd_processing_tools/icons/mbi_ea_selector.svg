<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- MBI EA Selector: MBI area (orange/red) matched to selectable EA coverage (green shades) -->
  <!-- Background: MBI discrepancy zone -->
  <path d="M2 5 L11 3 L12 11 L3 12 Z" fill="#ff7f00" fill-opacity="0.5" stroke="#e65100" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- EA coverage options (selectable, color-coded) -->
  <path d="M12 3 L22 4 L21 12 L12 11 Z" fill="#81c784" stroke="#2e7d32" stroke-width="1.0" stroke-linejoin="round"/>
  <path d="M3 12 L12 11 L13 20 L4 21 Z" fill="#4fc3f7" stroke="#0277bd" stroke-width="1.0" stroke-linejoin="round"/>
  <path d="M12 11 L21 12 L20 20 L13 20 Z" fill="#ce93d8" stroke="#7b1fa2" stroke-width="1.0" stroke-linejoin="round"/>
  <!-- Checkmark overlay for selection -->
  <path d="M14 15 L16 17 L20 13" fill="none" stroke="#1b5e20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

