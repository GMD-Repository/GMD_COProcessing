<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- MBI Tools: Municipal / Barangay Interface boundary tools -->
  <rect x="2" y="2" width="20" height="20" rx="3" fill="#1f5f8b"/>
  <!-- Left polygon -->
  <path d="M5 6 L14 5 L13 15 L5 17 Z" fill="#8fd18a" fill-opacity="0.8" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Right polygon -->
  <path d="M10 8 L19 7 L18 18 L10 17 Z" fill="#b8e3b4" fill-opacity="0.8" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Overlapping intersection -->
  <path d="M10 8 L14 7.6 L13 15 L10 15.7 Z" fill="#ff7f00" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
</svg>

