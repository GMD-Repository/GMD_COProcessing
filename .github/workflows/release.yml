name: Release QGIS plugin

# Two release channels, each with its own branch, version line and QGIS plugin repository URL:
#
#   Channel  Pushed / merged into  Version (tag)              Published to branch   Release type
#   Beta     dev                   vX.Y.Z-beta.N              plugin-repo-beta      pre-release (experimental)
#   Stable   main                  vX.Y.Z                     plugin-repo           full release
#
# Versions:
#   - Stable: patch + 1 of the latest stable tag (v0.3.20 -> v0.3.21).
#   - Beta:   the NEXT stable version + "-beta.N" (after v0.3.20: v0.3.21-beta.1, -beta.2, ...).
#     So a beta is always newer than the current stable and older than the stable it leads to.
#   - A release published by hand sets its own version from its tag ("v0.4.0" or "v0.4.0-beta.1");
#     tick "pre-release" for the Beta channel. The next automatic release continues from it.
#
# QGIS plugin repository URLs (Plugins > Manage and Install Plugins > Settings > Add...):
#   Stable: https://raw.githubusercontent.com/<owner>/<repo>/plugin-repo/plugins.xml
#   Beta:   https://raw.githubusercontent.com/<owner>/<repo>/plugin-repo-beta/plugins.xml
#
# Who can release is controlled by the branch rules on GitHub (see README.md > Contributing):
# only the maintainer can merge into dev and main.

on:
  push:
    branches: [main, dev]
    paths-ignore: ["README.md", ".gitignore", ".gitattributes", "docs/**", ".claude/**", ".github/CODEOWNERS",
                   ".github/ISSUE_TEMPLATE/**", ".github/pull_request_template.md"]
  release:
    types: [published]

# One release at a time, so two quick pushes cannot pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Folder name inside the zip = Python package name QGIS loads. Do not change.
  PLUGIN_DIR: GMD_COProcessing

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      repo_branch: ${{ steps.version.outputs.repo_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, to find the latest version

      - name: Work out the channel and version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Latest stable tag vX.Y.Z (no suffix)
          LAST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$LAST" ]; then
            NEXT="0.1.0"
          else
            IFS=. read -r MAJ MIN PAT <<< "${LAST#v}"
            NEXT="${MAJ}.${MIN}.$((PAT + 1))"
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="$RELEASE_TAG"
            PRERELEASE="$RELEASE_PRERELEASE"
          elif [ "$BRANCH" = "dev" ]; then
            # Next stable version + -beta.N, N = number of betas of that version so far + 1
            N=$(git tag -l "v${NEXT}-beta.*" | grep -cE "^v${NEXT//./\\.}-beta\.[0-9]+$" || true)
            TAG="v${NEXT}-beta.$((N + 1))"
            PRERELEASE=true
          else
            TAG="v${NEXT}"
            PRERELEASE=false
          fi

          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version number. Use v0.4.0 (Stable) or v0.4.0-beta.1 (Beta, pre-release)."
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            CHANNEL=beta;   REPO_BRANCH=plugin-repo-beta
          else
            CHANNEL=stable; REPO_BRANCH=plugin-repo
          fi
          echo "Channel: $CHANNEL  Version: $TAG  Published to: $REPO_BRANCH"
          { echo "TAG=${TAG}"; echo "VERSION=${VERSION}"; echo "PRERELEASE=${PRERELEASE}";
            echo "CHANNEL=${CHANNEL}"; echo "REPO_BRANCH=${REPO_BRANCH}"; } >> "$GITHUB_ENV"
          { echo "tag=${TAG}"; echo "channel=${CHANNEL}"; echo "repo_branch=${REPO_BRANCH}"; } >> "$GITHUB_OUTPUT"

      - name: Check Python syntax
        run: python -m compileall -q -x "/.github/" .

      - name: Export plugin files
        run: |
          mkdir -p build
          # The repo root is the plugin folder; respects export-ignore entries in .gitattributes
          git archive --format=tar --prefix="${PLUGIN_DIR}/" HEAD | tar -x -C build

      - name: Stamp version and links into metadata.txt
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          META="build/${PLUGIN_DIR}/metadata.txt"
          sed -i "s/^version=.*/version=${VERSION}/" "$META"
          if [ "$PRERELEASE" = "true" ]; then
            EXP=True
            # Make the Beta build recognisable in the QGIS Plugin Manager
            sed -i "s/^description=\(.*\)$/description=[BETA] \1/" "$META"
          else
            EXP=False
          fi
          sed -i "s/^experimental=.*/experimental=${EXP}/" "$META"
          sed -i "s#^homepage=.*#homepage=${REPO_URL}#; s#^repository=.*#repository=${REPO_URL}#; s#^tracker=.*#tracker=${REPO_URL}/issues#" "$META"
          grep -E '^(version|description|experimental|homepage|repository|tracker)=' "$META"

      - name: Write the changelog (merged pull requests per release of this channel)
        env:
          GH_TOKEN: ${{ github.token }}   # to read each PR's description for its brief detail
        run: |
          python .github/scripts/make_changelog.py \
            --metadata "build/${PLUGIN_DIR}/metadata.txt" \
            --version "${VERSION}" --channel "${CHANNEL}"

      - name: Build zip
        run: |
          cd build
          zip -r "../${PLUGIN_DIR}.${VERSION}.zip" "${PLUGIN_DIR}"
          cd ..
          unzip -l "${PLUGIN_DIR}.${VERSION}.zip"

      - name: Build plugins.xml (QGIS plugin repository file)
        env:
          RAW: https://raw.githubusercontent.com/${{ github.repository }}
        run: |
          python .github/scripts/make_plugins_xml.py \
            --metadata "build/${PLUGIN_DIR}/metadata.txt" \
            --version "${VERSION}" \
            --zip-name "${PLUGIN_DIR}.${VERSION}.zip" \
            --download-url "${RAW}/${REPO_BRANCH}/${PLUGIN_DIR}.${VERSION}.zip" \
            --icon-url "${RAW}/${REPO_BRANCH}/icon.svg" \
            --out plugins.xml

      - name: Create the release (push) or attach to it (manual release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            gh release upload "$TAG" "${PLUGIN_DIR}.${VERSION}.zip" plugins.xml --clobber
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" "${PLUGIN_DIR}.${VERSION}.zip" plugins.xml \
              --target "${{ github.sha }}" --title "$TAG (Beta)" --generate-notes --prerelease
          else
            gh release create "$TAG" "${PLUGIN_DIR}.${VERSION}.zip" plugins.xml \
              --target "${{ github.sha }}" --title "$TAG" --generate-notes --latest
          fi

      - name: Publish to the plugin repository branch (raw.githubusercontent.com)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          cp "${PLUGIN_DIR}.${VERSION}.zip" plugins.xml site/
          cp icon.svg site/
          cd site
          git init -q -b "${REPO_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "QGIS plugin repository (${CHANNEL}): ${TAG}"
          # The branch only ever holds the latest release of its channel, so it is replaced each time.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "${REPO_BRANCH}"
          echo "Repository URL: https://raw.githubusercontent.com/${{ github.repository }}/${REPO_BRANCH}/plugins.xml"

  # Emails the maintainer when a release finishes publishing (or fails to).
  # One-time setup: repo Settings > Secrets and variables > Actions > Secrets:
  #   MAIL_USERNAME  SMTP login (e.g. your Gmail address)
  #   MAIL_PASSWORD  SMTP password (Gmail: an App Password, not the account password)
  #   NOTIFY_EMAIL   address that receives the notification
  # Optional: MAIL_SERVER (default smtp.gmail.com) and MAIL_PORT (default 465).
  # Without these secrets the job is skipped and the release is unaffected.
  notify:
    needs: package
    if: always()
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
    steps:
      - name: Check email is configured
        id: cfg
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ] && [ -n "$NOTIFY_EMAIL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Email secrets not set - skipping notification."
          fi

      - name: Send email
        if: steps.cfg.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GMD CO Processing releases <${{ secrets.MAIL_USERNAME }}>
          subject: "${{ needs.package.result == 'success' && 'Released' || 'FAILED release' }} (${{ needs.package.outputs.channel || 'unknown channel' }}): GMD CO Processing ${{ needs.package.outputs.tag }}"
          body: |
            Release ${{ needs.package.outputs.tag }} (${{ needs.package.outputs.channel }}) of ${{ github.repository }}: ${{ needs.package.result }}.

            ${{ needs.package.result == 'success' && 'The QGIS plugin repository was updated. In QGIS: Plugins > Manage and Install Plugins > Settings > Reload Repositories, then upgrade GMD CO Processing.' || 'The plugin repository was NOT updated. Check the workflow run for the error.' }}

            Release:  ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.package.outputs.tag }}
            Run log:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Repository URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.package.outputs.repo_branch }}/plugins.xml
