name: Release QGIS plugin

# Builds the plugin zip and plugins.xml for every published GitHub release.
# The release tag sets the plugin version and must be a version number: "v0.2.0" -> version=0.2.0.
#
# Both files are attached to the release AND published to the "plugin-repo" branch, which is
# served by raw.githubusercontent.com (reachable even where github.com downloads time out).
#
# QGIS plugin repository URL (Plugins > Manage and Install Plugins > Settings > Add...):
#   https://raw.githubusercontent.com/<owner>/<repo>/plugin-repo/plugins.xml

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  # Folder name inside the zip = Python package name QGIS loads. Do not change.
  PLUGIN_DIR: GMD_COProcessing
  REPO_BRANCH: plugin-repo

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag is a version number
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Release tag '$TAG' is not a version number. Use a tag like v0.2.0 (QGIS compares versions to offer upgrades)."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Check Python syntax
        run: python -m compileall -q "${PLUGIN_DIR}"

      - name: Export plugin files
        run: |
          mkdir -p build
          # Only the plugin package folder; respects export-ignore entries in .gitattributes
          git archive --format=tar --prefix="${PLUGIN_DIR}/" "HEAD:${PLUGIN_DIR}" | tar -x -C build

      - name: Stamp version and links into metadata.txt
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          META="build/${PLUGIN_DIR}/metadata.txt"
          sed -i "s/^version=.*/version=${VERSION}/" "$META"
          if [ "$PRERELEASE" = "true" ]; then EXP=True; else EXP=False; fi
          sed -i "s/^experimental=.*/experimental=${EXP}/" "$META"
          sed -i "s#^homepage=.*#homepage=${REPO_URL}#; s#^repository=.*#repository=${REPO_URL}#; s#^tracker=.*#tracker=${REPO_URL}/issues#" "$META"
          grep -E '^(version|experimental|homepage|repository|tracker)=' "$META"

      - name: Build zip
        run: |
          cd build
          zip -r "../${PLUGIN_DIR}.${VERSION}.zip" "${PLUGIN_DIR}"
          cd ..
          unzip -l "${PLUGIN_DIR}.${VERSION}.zip"

      - name: Build plugins.xml (QGIS plugin repository file)
        env:
          RAW: https://raw.githubusercontent.com/${{ github.repository }}
        run: |
          python .github/scripts/make_plugins_xml.py \
            --metadata "build/${PLUGIN_DIR}/metadata.txt" \
            --version "${VERSION}" \
            --zip-name "${PLUGIN_DIR}.${VERSION}.zip" \
            --download-url "${RAW}/${REPO_BRANCH}/${PLUGIN_DIR}.${VERSION}.zip" \
            --icon-url "${RAW}/${REPO_BRANCH}/icon.svg" \
            --out plugins.xml

      - name: Attach zip and plugins.xml to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "${PLUGIN_DIR}.${VERSION}.zip" plugins.xml --clobber

      - name: Publish to the plugin-repo branch (raw.githubusercontent.com)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir site
          cp "${PLUGIN_DIR}.${VERSION}.zip" plugins.xml site/
          cp "${PLUGIN_DIR}/icon.svg" site/
          cd site
          git init -q -b "${REPO_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "QGIS plugin repository: ${TAG}"
          # The branch only ever holds the latest release, so it is replaced each time.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "${REPO_BRANCH}"
          echo "Repository URL: https://raw.githubusercontent.com/${{ github.repository }}/${REPO_BRANCH}/plugins.xml"

  # Emails the maintainer when a release finishes publishing (or fails to).
  # One-time setup: repo Settings > Secrets and variables > Actions > Secrets:
  #   MAIL_USERNAME  SMTP login (e.g. your Gmail address)
  #   MAIL_PASSWORD  SMTP password (Gmail: an App Password, not the account password)
  #   NOTIFY_EMAIL   address that receives the notification
  # Optional: MAIL_SERVER (default smtp.gmail.com) and MAIL_PORT (default 465).
  # Without these secrets the job is skipped and the release is unaffected.
  notify:
    needs: package
    if: always()
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
    steps:
      - name: Check email is configured
        id: cfg
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ] && [ -n "$NOTIFY_EMAIL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Email secrets not set - skipping notification."
          fi

      - name: Send email
        if: steps.cfg.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GMD CO Processing releases <${{ secrets.MAIL_USERNAME }}>
          subject: "${{ needs.package.result == 'success' && 'Released' || 'FAILED release' }}: GMD CO Processing ${{ github.event.release.tag_name }}"
          body: |
            Release ${{ github.event.release.tag_name }} of ${{ github.repository }}: ${{ needs.package.result }}.

            ${{ needs.package.result == 'success' && 'The QGIS plugin repository was updated. In QGIS: Plugins > Manage and Install Plugins > Settings > Reload Repositories, then upgrade GMD CO Processing.' || 'The plugin repository was NOT updated. Check the workflow run for the error.' }}

            Release:  ${{ github.event.release.html_url }}
            Run log:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Repository URL: https://raw.githubusercontent.com/${{ github.repository }}/plugin-repo/plugins.xml
